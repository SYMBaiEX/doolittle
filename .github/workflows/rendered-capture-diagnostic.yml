name: rendered-capture-diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/rendered-capture-diagnostic.yml
      - playwright.config.ts
      - playwright.rendered.config.ts
      - e2e/browser-renderer.pw.ts
      - apps/desktop/e2e/**
      - apps/desktop/src/main/browser-renderer.ts
      - apps/desktop/src/main/browser-render-facts.ts
      - apps/desktop/src/main/browser-render-window.ts
      - apps/desktop/src/main/browser-render-readiness.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-workload-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transport: [native, playwright]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Nub and Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: 0.9.5
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Set up Bun for native runtime tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: nub install --frozen-lockfile --ignore-scripts

      - name: Install Electron runtime
        run: nub run desktop:runtime:install

      - name: Check application and desktop types
        run: nub run check

      - name: Build local sandbox image
        run: nub run sandbox:setup

      - name: Build desktop renderer
        run: nub run desktop:build

      # Each test owns a fresh Electron process and profile. Repeat fixed samples;
      # retries remain disabled, and any failed sample keeps the job failed.
      # Fixed matched-workload experiment, not a replacement retry: both arms
      # use full-CI setup and its offline agent/API web server at DPR 2. The only
      # arm input is the existing startup transport; production code, deadlines,
      # case order and strict first-PNG assertions stay identical. Captures run
      # before unrelated UI cases in full CI, so select only this fixture here.
      # This does not isolate individual debugger flags or establish causality.
      # No model request is dispatched by this offline fixture. Both Linux
      # transports use --no-sandbox; production sandbox parity is not established.
      # Earlier standalone scale-matrix results remain immutable run evidence.
      - name: Compare three cold samples under the full-CI workload
        run: xvfb-run -a --server-args='-screen 0 3840x2160x24' nubx playwright test --config playwright.config.ts e2e/browser-renderer.pw.ts --repeat-each=3 --retries=0 --global-timeout=300000 --reporter=list,html
        env:
          DOOLITTLE_RENDER_CAPTURE_ORDER: complete-first
          DOOLITTLE_RENDER_CAPTURE_TRANSPORT: ${{ matrix.transport }}
          DOOLITTLE_RENDER_CAPTURE_SCALE: "2"
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: var/playwright/full-workload-rendered-report

      - name: Preserve synthetic capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-workload-capture-evidence-${{ matrix.transport }}
          path: |
            var/playwright/test-results
            var/playwright/full-workload-rendered-report
          if-no-files-found: warn
          retention-days: 7
