name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the complete Vitest suite and real Electron smoke tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Nub and Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: 0.9.5
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Set up Bun for native runtime tests
        if: inputs.full_validation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: nub install --frozen-lockfile --ignore-scripts

      - name: Install Electron runtime
        if: inputs.full_validation
        run: nub run desktop:runtime:install

      - name: Check formatting and lint
        run: nub run lint:check

      - name: Check application and desktop types
        run: nub run typecheck && nub run desktop:typecheck

      - name: Essential execution, cancellation, permission, and data tests
        if: ${{ !inputs.full_validation }}
        run: nub run test:essential

      - name: Complete Vitest suite (deliberate full validation)
        if: inputs.full_validation
        run: nub run test:all

      - name: Build agent
        run: nub run build

      - name: Build local sandbox image
        if: inputs.full_validation
        run: nub run sandbox:setup

      - name: Playwright smoke tests
        if: inputs.full_validation
        run: xvfb-run -a --server-args='-screen 0 3840x2160x24' nub run test:e2e

      - name: Acceptance gates
        run: nub run check:acceptance
