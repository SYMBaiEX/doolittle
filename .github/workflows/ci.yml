name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Nub and Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: 0.7.5
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile --ignore-scripts

      - name: Install Electron runtime
        run: nub run desktop:runtime:install

      - name: Check application and desktop types
        run: nub run check

      - name: Playwright smoke tests
        run: xvfb-run -a nub run test:e2e

      - name: Acceptance gates
        run: nub run check:acceptance
