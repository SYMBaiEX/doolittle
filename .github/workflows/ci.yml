name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nub and Node
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.6.0
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile --ignore-scripts

      - name: Install Electron runtime
        run: nub run desktop:runtime:install

      - name: Check application and desktop types
        run: nub run check

      - name: Playwright smoke tests
        run: nub run test:e2e

      - name: Acceptance gates
        run: nub run check:acceptance
