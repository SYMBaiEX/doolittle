name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance_changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
      windows_provider: ${{ steps.paths.outputs.windows_provider }}
    steps:
      - name: Check out PR merge and its parents
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Match acceptance inputs
        id: paths
        shell: bash
        run: |
          changed() {
            local lane=$1 status=0
            shift
            # Compare the tested merge tree with its first parent (the base).
            git diff --quiet --no-ext-diff --no-renames HEAD^1 HEAD -- "$@" || status=$?
            case "$status" in
              0) echo "$lane=false" >> "$GITHUB_OUTPUT" ;;
              1) echo "$lane=true" >> "$GITHUB_OUTPUT" ;;
              *) return "$status" ;;
            esac
          }

          shared=(
            .github/workflows/ci.yml .gitattributes .node-version .npmrc package.json nub.lock
            ':(glob)apps/**/package.json' ':(glob)packages/**/package.json'
            tsconfig.json tsconfig.base.json vitest.config.ts
            scripts/prepare-eliza-source.ts scripts/eliza-source-policy.ts tooling/eliza-source vendor
          )
          changed native "${shared[@]}" \
            .env.example .gitignore AGENTS.md LICENSE apps/cli apps/desktop packages \
            scripts/build-cli.ts scripts/cli-build-options.ts scripts/run-desktop-packaged-tests.ts \
            tests/e2e tests/fixtures tests/integration tests/support \
            playwright.packaged.config.ts playwright.workbench.config.ts vitest.integration.config.ts
          changed windows_provider "${shared[@]}" \
            packages/plugins/provider-transport scripts/vitest-scope.ts tests/boundary/provider-command.test.ts

  validate:
    runs-on: boat-large
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Nub and Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: 0.11.1
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub run deps:install -- --frozen-lockfile --ignore-scripts

      - name: Check formatting and lint
        run: nub run lint:check

      - name: Check every workspace and tooling types
        run: nub run typecheck

      - name: Fast security and state boundaries
        run: nub run test

      - name: Build CLI and desktop
        run: nub run build

      - name: Acceptance gates
        run: nub run check:acceptance

  cli_acceptance:
    needs: acceptance_changes
    if: >-
      ${{ !cancelled() && (needs.acceptance_changes.result != 'success' ||
          needs.acceptance_changes.outputs.native != 'false') }}
    runs-on: boat-large
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Nub and Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: 0.11.1
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Set up Bun for native runtime tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: nub run deps:install -- --frozen-lockfile --ignore-scripts

      - name: Install isolated browser fixture
        run: nubx playwright install --with-deps chromium

      - name: Exercise CLI chat and shared-engine workers
        run: nub run test:e2e:release:source

  desktop_acceptance:
    needs: acceptance_changes
    if: >-
      ${{ !cancelled() && (needs.acceptance_changes.result != 'success' ||
          needs.acceptance_changes.outputs.native != 'false') }}
    runs-on: boat-large
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Nub and Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: 0.11.1
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Set up Bun for native runtime tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: nub run deps:install -- --frozen-lockfile --ignore-scripts

      - name: Install Electron runtime
        run: nub run desktop:runtime:install

      - name: Install isolated browser fixture
        run: nubx playwright install --with-deps chromium

      - name: Exercise native new-chat and run lifecycle
        run: xvfb-run -a nub run test:e2e:release:workbench-core

      - name: Build clean-HEAD desktop directory package
        run: nub run desktop:package:dir

      - name: Exercise packaged offline chat with verified provenance
        run: xvfb-run -a nub run test:e2e:release:packaged-core

  windows_provider_acceptance:
    needs: acceptance_changes
    if: >-
      ${{ !cancelled() && (needs.acceptance_changes.result != 'success' ||
          needs.acceptance_changes.outputs.windows_provider != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 15
    # Keep nub's cache and store on the workspace drive; a fresh download there
    # is faster than restoring the ~870 MB store archive onto the runner.
    env:
      XDG_CACHE_HOME: D:/a/_nub/cache
      XDG_DATA_HOME: D:/a/_nub/data
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Nub and Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: 0.11.1
          node-version-file: .node-version
          cache: false
      - name: Install dependencies
        run: nub run deps:install -- --frozen-lockfile --ignore-scripts
      - name: Verify provider process trees and capture budgets on Windows
        run: nub run test:scope tests/boundary/provider-command.test.ts
