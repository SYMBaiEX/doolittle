name: desktop-windows

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact existing v-prefixed release tag to build
        required: true
        type: string
      windows_publisher_name:
        description: Full Authenticode signer subject DN used by electron-updater
        required: false
        type: string
    secrets:
      WIN_CSC_LINK:
        required: true
      WIN_CSC_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing v-prefixed release tag; select the same tag as the workflow ref
        required: true
        type: string
      windows_publisher_name:
        description: Full Authenticode signer subject DN used by electron-updater
        required: false
        type: string

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Nub and Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: 0.7.5
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile --ignore-scripts

      - name: Install Electron runtime
        run: nub run desktop:runtime:install

      - name: Bind build to exact release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if (-not [regex]::IsMatch($env:RELEASE_TAG, '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$')) {
            throw "Release tag $env:RELEASE_TAG is not an exact version tag."
          }
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          if ($env:GITHUB_REF -ne $tagRef) {
            throw "Workflow ref $env:GITHUB_REF must exactly match requested release tag $tagRef."
          }
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $tagRef is not present in the checkout."
          }
          $tagCommit = (git rev-parse --verify "$($tagRef)^{}").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not peel release tag $tagRef to a commit."
          }
          $headCommit = (git rev-parse --verify HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw "Checked-out HEAD $headCommit does not match peeled tag commit $tagCommit."
          }
          if ($headCommit -ne $env:GITHUB_SHA) {
            throw "Checked-out HEAD $headCommit does not match workflow commit $env:GITHUB_SHA."
          }
          $expected = "v$((Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag $env:RELEASE_TAG must match apps/desktop/package.json version $expected."
          }
          git merge-base --is-ancestor $headCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $headCommit must be on origin/main."
          }

      - name: Check application and acceptance contracts
        run: |
          nub run check
          nub run check:acceptance

      - name: Verify desktop
        run: nub run desktop:test

      - name: Require signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ inputs.windows_publisher_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw "WIN_CSC_LINK is required for releases."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "WIN_CSC_KEY_PASSWORD is required for releases."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_PUBLISHER_NAME)) {
            throw "The full Authenticode signer subject DN is required for releases."
          }

      - name: Build Windows installer
        run: nub run desktop:package:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ inputs.windows_publisher_name }}

      - name: Smoke-test bundled Windows runtime
        shell: pwsh
        run: |
          $runtimeData = Join-Path $env:RUNNER_TEMP "doolittle-runtime-smoke"
          New-Item -ItemType Directory -Force -Path $runtimeData | Out-Null
          '{"mode":"desktop","provider":null,"profile":"windows-ci"}' |
            Set-Content -Encoding utf8 (Join-Path $runtimeData "onboarding.json")

          $repoRoot = (Resolve-Path ".").Path
          $env:DOOLITTLE_REPO_ROOT = $repoRoot
          $env:DOOLITTLE_DATA_DIR = $runtimeData
          $env:DOOLITTLE_SKILLS_DIR = Join-Path $repoRoot "packages/skills"
          $env:ELIZAOS_BUNDLED_SKILLS_DIR = $env:DOOLITTLE_SKILLS_DIR
          $env:DOOLITTLE_WORKSPACE_DIR = $runtimeData
          $env:DOOLITTLE_CRON_OUTPUT_DIR = Join-Path $runtimeData "cron-output"
          $env:DOOLITTLE_GATEWAY_DATA_DIR = Join-Path $runtimeData "gateway"
          $env:DOOLITTLE_HOOKS_DIR = Join-Path $runtimeData "hooks"
          $env:PGLITE_DATA_DIR = Join-Path $runtimeData "pglite"
          $env:DOOLITTLE_HOST = "127.0.0.1"
          $env:DOOLITTLE_PORT = "43199"
          $env:DOOLITTLE_MODE = "api"
          $env:DOOLITTLE_OFFLINE_BOOTSTRAP = "true"
          $env:DOOLITTLE_USE_LINKED_DEVIN_AUTH = "false"
          $env:DATABASE_URL = ""
          $env:POSTGRES_URL = ""

          $stdout = Join-Path $runtimeData "stdout.log"
          $stderr = Join-Path $runtimeData "stderr.log"
          $packagedResources = Join-Path $repoRoot "apps/desktop/release/win-unpacked/resources"
          $packagedRuntime = Join-Path $packagedResources "runtime"
          $runtimeEntry = Join-Path $packagedRuntime "bin/doolittle-runtime.mjs"
          $electronExecutable = Join-Path $repoRoot "apps/desktop/release/win-unpacked/Doolittle.exe"
          if (-not (Test-Path $runtimeEntry -PathType Leaf)) {
            throw "Packaged runtime is missing: $runtimeEntry"
          }
          if (-not (Test-Path $electronExecutable -PathType Leaf)) {
            throw "Packaged Electron executable is missing: $electronExecutable"
          }
          $env:DOOLITTLE_REPO_ROOT = $packagedRuntime
          $env:DOOLITTLE_SKILLS_DIR = Join-Path $packagedRuntime "packages/skills"
          $env:ELIZAOS_BUNDLED_SKILLS_DIR = $env:DOOLITTLE_SKILLS_DIR
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:DOOLITTLE_DESKTOP_RUNTIME = "1"
          $runtime = Start-Process `
            -FilePath $electronExecutable `
            -ArgumentList "`"$runtimeEntry`" api" `
            -WorkingDirectory $packagedRuntime `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          try {
            $healthy = $false
            1..120 | ForEach-Object {
              if ($healthy) {
                return
              }
              if ($runtime.HasExited) {
                throw "Bundled runtime exited with code $($runtime.ExitCode)."
              }
              try {
                $health = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:43199/health" `
                  -TimeoutSec 1
                $healthy = $health.status -eq "ok"
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $healthy) {
              throw "Bundled runtime did not become healthy within 60 seconds."
            }
            Write-Host "Packaged Windows runtime is healthy."
          } finally {
            if (-not $runtime.HasExited) {
              Stop-Process -Id $runtime.Id -Force
            }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
          }

      - name: Smoke-test packaged Windows application shell
        shell: pwsh
        run: |
          $env:DOOLITTLE_DESKTOP_EXECUTABLE = (Resolve-Path "apps/desktop/release/win-unpacked/Doolittle.exe").Path
          nub run test:e2e:desktop-packaged

      - name: Verify installer artifact
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_PUBLISHER_NAME: ${{ inputs.windows_publisher_name }}
        run: |
          $installer = Get-ChildItem apps/desktop/release/Doolittle-*-win-x64.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Doolittle Windows installer was not produced."
          }
          Write-Host "Installer ready: $($installer.FullName) ($($installer.Length) bytes)"
          $updateManifest = Get-Item apps/desktop/release/latest.yml
          $blockmap = Get-Item "$($installer.FullName).blockmap"
          Write-Host "Update manifest ready: $($updateManifest.FullName)"
          Write-Host "Installer blockmap ready: $($blockmap.FullName)"

          $app = Get-Item apps/desktop/release/win-unpacked/Doolittle.exe
          $appUpdate = Get-Item apps/desktop/release/win-unpacked/resources/app-update.yml
          $installerSignature = Get-AuthenticodeSignature $installer.FullName
          $appSignature = Get-AuthenticodeSignature $app.FullName
          if (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            if ($installerSignature.Status -ne "Valid") {
              throw "Installer signature is $($installerSignature.Status), expected Valid."
            }
            if ($appSignature.Status -ne "Valid") {
              throw "Application signature is $($appSignature.Status), expected Valid."
            }
            if ([string]::IsNullOrWhiteSpace($env:WIN_PUBLISHER_NAME)) {
              throw "WIN_PUBLISHER_NAME is required for a signed update artifact."
            }
            if ($appSignature.SignerCertificate.Subject -ne $env:WIN_PUBLISHER_NAME) {
              throw "Application signer subject does not match WIN_PUBLISHER_NAME."
            }
            nub apps/desktop/scripts/verify-windows-update-manifest.ts `
              --manifest $appUpdate.FullName `
              --expected-publisher $env:WIN_PUBLISHER_NAME
            Write-Host "Windows Authenticode signatures are valid."
          } else {
            Write-Warning "WIN_CSC_LINK is not configured; producing an unsigned development artifact."
          }

      - name: Record Windows package provenance
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release/Doolittle-*-win-x64.exe | Select-Object -First 1
          if (-not $installer) { throw "Doolittle Windows installer was not produced." }
          $createdAt = git show -s --format=%cI "$env:GITHUB_SHA"
          nub apps/desktop/scripts/package-provenance.ts --write-receipt --release-directory apps/desktop/release --platform windows --commit "$env:GITHUB_SHA" --created-at "$createdAt" --app-asar win-unpacked/resources/app.asar --artifact $installer.Name --artifact "$($installer.Name).blockmap" --artifact latest.yml
          nub apps/desktop/scripts/package-provenance.ts --verify-runtime-tree --release-directory apps/desktop/release --platform windows --runtime-directory win-unpacked/resources/runtime

      - name: Install, launch, and uninstall the NSIS artifact
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          $installer = Get-ChildItem apps/desktop/release/Doolittle-*-win-x64.exe | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP "Doolittle-installed"
          $install = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDirectory") `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)."
          }

          $installedApp = Join-Path $installDirectory "Doolittle.exe"
          if (-not (Test-Path $installedApp -PathType Leaf)) {
            throw "Installed application is missing: $installedApp"
          }
          $installedSignature = Get-AuthenticodeSignature $installedApp
          if (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            if ($installedSignature.Status -ne "Valid") {
              throw "Installed application signature is $($installedSignature.Status), expected Valid."
            }
            Write-Host "Installed Windows Authenticode signature is valid."
          } else {
            Write-Warning "WIN_CSC_LINK is not configured; installed development artifact is unsigned."
          }
          $sourceAsar = (Resolve-Path "apps/desktop/release/win-unpacked/resources/app.asar").Path
          $installedAsar = Join-Path $installDirectory "resources/app.asar"
          if (-not (Test-Path $installedAsar -PathType Leaf)) {
            throw "Installed app.asar is missing: $installedAsar"
          }
          if ((Get-FileHash $sourceAsar -Algorithm SHA256).Hash -ne (Get-FileHash $installedAsar -Algorithm SHA256).Hash) {
            throw "Installed app.asar does not match the verified package receipt source."
          }
          nub apps/desktop/scripts/package-provenance.ts --verify-runtime-tree --release-directory apps/desktop/release --platform windows --runtime-directory "$installDirectory/resources/runtime"
          $env:DOOLITTLE_DESKTOP_EXECUTABLE = $installedApp
          nub run test:e2e:desktop-packaged

          $uninstaller = Get-ChildItem $installDirectory -Filter "Uninstall*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            throw "NSIS uninstaller was not installed."
          }
          $uninstall = Start-Process `
            -FilePath $uninstaller.FullName `
            -ArgumentList "/S" `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with code $($uninstall.ExitCode)."
          }
          if (Test-Path $installedApp) {
            throw "NSIS uninstall left the application executable behind."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Doolittle-Windows-x64
          path: |
            apps/desktop/release/Doolittle-*-win-x64.exe
            apps/desktop/release/Doolittle-*-win-x64.exe.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/desktop-provenance-windows.json
            apps/desktop/release/doolittle-desktop-windows.spdx.json
          if-no-files-found: error
