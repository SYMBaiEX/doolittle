name: desktop-linux

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Nub and Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: 0.7.5
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub install --frozen-lockfile --ignore-scripts

      - name: Install Electron runtime
        run: nub run desktop:runtime:install

      - name: Verify tagged release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node --input-type=module --eval 'import manifest from "./apps/desktop/package.json" with { type: "json" }; console.log(manifest.version)')"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME must match apps/desktop/package.json version $expected." >&2
            exit 1
          }

      - name: Check application and acceptance contracts
        run: |
          nub run check
          nub run check:acceptance

      - name: Verify desktop
        run: nub run desktop:test

      - name: Build Linux packages
        run: |
          nub run desktop:build
          nub run --cwd apps/desktop runtime:prepare
          nub apps/desktop/scripts/package.ts --linux AppImage deb --x64
          nub apps/desktop/scripts/verify-package.ts

      - name: Record Linux package provenance
        run: |
          appimage="$(find apps/desktop/release -maxdepth 1 -name 'Doolittle-*-linux-x64.AppImage' -printf '%f\n' -quit)"
          deb="$(find apps/desktop/release -maxdepth 1 -name 'Doolittle-*-linux-x64.deb' -printf '%f\n' -quit)"
          test -n "$appimage" && test -n "$deb"
          nub apps/desktop/scripts/package-provenance.ts --write-receipt --release-directory apps/desktop/release --platform linux --commit "$GITHUB_SHA" --app-asar linux-unpacked/resources/app.asar --artifact "$appimage" --artifact "$deb" --artifact latest-linux.yml
          nub apps/desktop/scripts/package-provenance.ts --verify-runtime-tree --release-directory apps/desktop/release --platform linux --runtime-directory apps/desktop/release/linux-unpacked/resources/runtime

      - name: Smoke-test bundled Linux runtime
        run: |
          runtime_data="$RUNNER_TEMP/doolittle-runtime-smoke"
          mkdir -p "$runtime_data"
          printf '%s\n' '{"mode":"desktop","provider":null,"profile":"linux-ci"}' > "$runtime_data/onboarding.json"

          executable="apps/desktop/release/linux-unpacked/Doolittle"
          packaged_runtime="apps/desktop/release/linux-unpacked/resources/runtime"
          runtime_entry="$packaged_runtime/bin/doolittle-runtime.mjs"
          test -x "$executable"
          test -f "$runtime_entry"

          export DOOLITTLE_REPO_ROOT="$PWD/$packaged_runtime"
          export DOOLITTLE_DATA_DIR="$runtime_data"
          export DOOLITTLE_SKILLS_DIR="$PWD/$packaged_runtime/packages/skills"
          export ELIZAOS_BUNDLED_SKILLS_DIR="$DOOLITTLE_SKILLS_DIR"
          export DOOLITTLE_WORKSPACE_DIR="$runtime_data"
          export DOOLITTLE_CRON_OUTPUT_DIR="$runtime_data/cron-output"
          export DOOLITTLE_GATEWAY_DATA_DIR="$runtime_data/gateway"
          export DOOLITTLE_HOOKS_DIR="$runtime_data/hooks"
          export PGLITE_DATA_DIR="$runtime_data/pglite"
          export DOOLITTLE_HOST="127.0.0.1"
          export DOOLITTLE_PORT="43199"
          export DOOLITTLE_MODE="api"
          export DOOLITTLE_OFFLINE_BOOTSTRAP="true"
          export DOOLITTLE_USE_LINKED_DEVIN_AUTH="false"
          export DATABASE_URL=""
          export POSTGRES_URL=""
          export ELECTRON_RUN_AS_NODE="1"
          export DOOLITTLE_DESKTOP_RUNTIME="1"

          "$executable" "$runtime_entry" api >"$runtime_data/stdout.log" 2>"$runtime_data/stderr.log" &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true; cat "$runtime_data/stdout.log"; cat "$runtime_data/stderr.log" >&2' EXIT
          for _ in {1..120}; do
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              echo "Bundled runtime exited before becoming healthy." >&2
              exit 1
            fi
            if curl --fail --silent "http://127.0.0.1:43199/health" | grep -q '"status":"ok"'; then
              echo "Packaged Linux runtime is healthy."
              exit 0
            fi
            sleep 0.5
          done
          echo "Bundled runtime did not become healthy within 60 seconds." >&2
          exit 1

      - name: Smoke-test packaged Linux application shell
        run: |
          executable="$PWD/apps/desktop/release/linux-unpacked/Doolittle"
          test -x "$executable"
          DOOLITTLE_DESKTOP_EXECUTABLE="$executable" xvfb-run -a nub run test:e2e:desktop-packaged

      - name: Exercise the AppImage and installed DEB
        run: |
          appimage="$(find apps/desktop/release -maxdepth 1 -name 'Doolittle-*-linux-x64.AppImage' -print -quit)"
          deb="$(find apps/desktop/release -maxdepth 1 -name 'Doolittle-*-linux-x64.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          chmod +x "$appimage"
          appimage_abs="$PWD/$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 DOOLITTLE_DESKTOP_EXECUTABLE="$appimage_abs" xvfb-run -a nub run test:e2e:desktop-packaged
          source_asar="$PWD/apps/desktop/release/linux-unpacked/resources/app.asar"
          extract_root="$RUNNER_TEMP/doolittle-appimage-extract"
          mkdir -p "$extract_root"
          (cd "$extract_root" && "$appimage_abs" --appimage-extract >/dev/null)
          cmp "$source_asar" "$extract_root/squashfs-root/resources/app.asar"
          nub apps/desktop/scripts/package-provenance.ts --verify-runtime-tree --release-directory apps/desktop/release --platform linux --runtime-directory "$extract_root/squashfs-root/resources/runtime"

          sudo apt-get update
          sudo apt-get install -y "$PWD/$deb"
          installed="$(find /opt -maxdepth 4 -type f -name Doolittle -perm -111 -print -quit)"
          test -n "$installed"
          cmp "$source_asar" "$(dirname "$installed")/resources/app.asar"
          nub apps/desktop/scripts/package-provenance.ts --verify-runtime-tree --release-directory apps/desktop/release --platform linux --runtime-directory "$(dirname "$installed")/resources/runtime"
          DOOLITTLE_DESKTOP_EXECUTABLE="$installed" xvfb-run -a nub run test:e2e:desktop-packaged
          package_name="$(dpkg-deb -f "$deb" Package)"
          sudo apt-get remove -y "$package_name"
          test ! -e "$installed"

      - name: Verify release artifacts
        run: |
          test -n "$(find apps/desktop/release -maxdepth 1 -name 'Doolittle-*-linux-*.AppImage' -print -quit)"
          test -n "$(find apps/desktop/release -maxdepth 1 -name 'Doolittle-*-linux-*.deb' -print -quit)"
          test -f apps/desktop/release/latest-linux.yml

      - name: Upload Linux release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Doolittle-Linux
          path: |
            apps/desktop/release/Doolittle-*-linux-*.AppImage
            apps/desktop/release/Doolittle-*-linux-*.deb
            apps/desktop/release/latest-linux.yml
            apps/desktop/release/desktop-provenance-linux.json
          if-no-files-found: error
