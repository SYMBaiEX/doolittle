[package]
name = "doolittle-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
doolittle-host = { path = "../../crates/doolittle-host" }
doolittle-runtime = { path = "../../crates/doolittle-runtime" }
directories = "6"
gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", default-features = false, features = ["tree-sitter-languages"] }
gpui-component-assets = "=0.5.1"
markdown = "1"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSObject", "NSString", "NSURL", "NSURLRequest", "NSURLResponse"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKContentRuleList", "WKContentRuleListStore", "WKDownload", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKSecurityOrigin", "WKUIDelegate", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "objc2-core-foundation"] }
raw-window-handle = "0.6"
tempfile = "3"
